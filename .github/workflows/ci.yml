name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  bash-installers:
    name: Bash installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smoke test install, verify, idempotency and errors
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d "${TMPDIR:-/tmp}/acs-ci.XXXXXX")"
          trap 'rm -rf "$work"' EXIT

          target="$work/project"
          mkdir -p "$target"

          bash install.sh "$target"
          bash install.sh --verify "$target"
          bash install.sh "$target"
          bash install.sh --verify "$target"

          expect_exit() {
            local expected="$1"
            shift
            local code=0
            set +e
            "$@" >"$work/output" 2>&1
            code=$?
            set -e
            if [ "$code" -ne "$expected" ]; then
              echo "expected exit $expected, got $code: $*" >&2
              cat "$work/output" >&2
              exit 1
            fi
          }

          expect_exit 2 bash install.sh --bogus

          missing="$work/does-not-exist"
          expect_exit 2 bash install.sh "$missing"
          grep -F "$missing" "$work/output"

          target2="$work/project-with-symlink"
          outside="$work/outside"
          mkdir -p "$target2" "$outside"
          ln -s "$outside" "$target2/10__ALWAYS_LOAD"
          expect_exit 2 bash install.sh "$target2"
          if [ "$(find "$outside" -type f | wc -l | tr -d ' ')" -ne 0 ]; then
            echo 'installer wrote through a symlinked parent' >&2
            exit 1
          fi

          agents="$work/project-with-agents"
          mkdir -p "$agents"
          printf 'my own agents file\n' > "$agents/AGENTS.md"
          expect_exit 0 bash install.sh "$agents"
          grep -F 'AGENTS.md already exists' "$work/output"
          grep -Fx 'my own agents file' "$agents/AGENTS.md"

          legacy="$work/project-with-legacy"
          mkdir -p "$legacy/10__ALWAYS_LOAD_FIRST"
          printf '# old entry\n' > "$legacy/00__AGENT__START_HERE.md"
          expect_exit 0 bash install.sh "$legacy"
          grep -F 'LEGACY' "$work/output"
          grep -F 'Legacy paths found: 2' "$work/output"
          expect_exit 0 bash install.sh --verify "$legacy"
          grep -F 'Legacy paths found: 2' "$work/output"

          expect_exit 0 bash lint.sh tests/fixtures/kb-good
          grep -F '0 errors' "$work/output"

          expect_exit 1 bash lint.sh tests/fixtures/kb-bad
          while IFS= read -r code; do
            grep -F "$code" "$work/output"
          done < tests/fixtures/kb-bad/expected-codes.txt

          expect_exit 0 bash lint.sh "$target"
          grep -F '0 errors' "$work/output"

          words="$(cat scaffold/10__ALWAYS_LOAD/*.md scaffold/00__AGENT__START_HERE.md | wc -w | tr -d ' ')"
          if [ "$words" -gt 3000 ]; then
            echo "always-loaded budget exceeded: $words words (limit 3000)" >&2
            exit 1
          fi

  powershell-installer:
    name: PowerShell installer (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smoke test install, verify, idempotency and errors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-ExitCode {
            param([int] $Expected, [string] $Action)
            if ($LASTEXITCODE -ne $Expected) {
              throw "expected exit $Expected for $Action, got $LASTEXITCODE"
            }
          }

          $work = Join-Path $env:RUNNER_TEMP ("acs-ci-" + [guid]::NewGuid().ToString('N'))
          try {
            $target = Join-Path $work 'project'
            New-Item -ItemType Directory -Path $target -Force | Out-Null

            & pwsh -NoProfile -File ./install.ps1 -TargetDir $target
            Assert-ExitCode 0 'initial install'
            & pwsh -NoProfile -File ./install.ps1 -Verify -TargetDir $target
            Assert-ExitCode 0 'initial verify'
            & pwsh -NoProfile -File ./install.ps1 -TargetDir $target
            Assert-ExitCode 0 'idempotent install'
            & pwsh -NoProfile -File ./install.ps1 -Verify -TargetDir $target
            Assert-ExitCode 0 'verify after reinstall'

            $missing = Join-Path $work 'does-not-exist'
            & pwsh -NoProfile -File ./install.ps1 -TargetDir $missing
            Assert-ExitCode 2 'missing target'

            $target2 = Join-Path $work 'project-with-conflict'
            New-Item -ItemType Directory -Path $target2 -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $target2 '00__AGENT__START_HERE.md') -Force | Out-Null
            & pwsh -NoProfile -File ./install.ps1 -TargetDir $target2
            Assert-ExitCode 2 'path conflict'
            if (Test-Path -LiteralPath (Join-Path $target2 '00__AGENT__START_HERE.md') -PathType Leaf) {
              throw 'installer replaced a directory with a file'
            }

            $agents = Join-Path $work 'project-with-agents'
            New-Item -ItemType Directory -Path $agents -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $agents 'AGENTS.md') -Value 'my own agents file'
            $agentsOut = (& pwsh -NoProfile -File ./install.ps1 -TargetDir $agents 2>&1 | Out-String)
            Assert-ExitCode 0 'existing AGENTS.md'
            if ($agentsOut -notmatch 'AGENTS\.md already exists') { throw 'expected an AGENTS.md hint' }
            if ((Get-Content -LiteralPath (Join-Path $agents 'AGENTS.md') -Raw).Trim() -ne 'my own agents file') { throw 'AGENTS.md was overwritten' }

            $legacy = Join-Path $work 'project-with-legacy'
            New-Item -ItemType Directory -Path (Join-Path $legacy '10__ALWAYS_LOAD_FIRST') -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $legacy '00__AGENT__START_HERE.md') -Value '# old entry'
            $legacyOut = (& pwsh -NoProfile -File ./install.ps1 -TargetDir $legacy 2>&1 | Out-String)
            Assert-ExitCode 0 'legacy install'
            $legacyLines = @($legacyOut -split "`n" | Where-Object { $_ -match 'LEGACY' })
            if ($legacyLines.Count -lt 2) { throw 'expected two LEGACY lines' }
            if ($legacyOut -notmatch 'Legacy paths found: 2') { throw 'expected legacy summary' }

            & pwsh -NoProfile -File ./lint.ps1 -TargetDir ./tests/fixtures/kb-good
            Assert-ExitCode 0 'lint good fixture'

            $badOut = (& pwsh -NoProfile -File ./lint.ps1 -TargetDir ./tests/fixtures/kb-bad 2>&1 | Out-String)
            Assert-ExitCode 1 'lint bad fixture'
            foreach ($code in Get-Content -LiteralPath ./tests/fixtures/kb-bad/expected-codes.txt) {
              if ($badOut -notmatch [regex]::Escape($code)) { throw "lint did not report $code" }
            }

            & pwsh -NoProfile -File ./lint.ps1 -TargetDir $target
            Assert-ExitCode 0 'lint installed project'
          }
          finally {
            if (Test-Path -LiteralPath $work) {
              Remove-Item -LiteralPath $work -Recurse -Force
            }
          }

          # The expected installer failures above leave $LASTEXITCODE non-zero.
          # GitHub's pwsh wrapper exits with it unless the step ends successfully.
          exit 0
